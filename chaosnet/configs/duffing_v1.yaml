system: duffing
seed: 42
parameters:
  c: 0.3
  k: -1.0
  beta: 1.0
  omega: 1.2
sampling:
  samples_per_period: 32
  substeps: 5
  window: 64
  horizon_periods: 20
control:
  bounds: [-0.5, 0.5]
  rate_limit: 2.0
experiments:
  n_runs: 8
  duration_periods: 80
  ramp_fraction: 0.5
  steady_amplitudes: [0.20, 0.30, 0.35, 0.40]
  ramp_amplitudes: [0.20, 0.40]
  # Hold each endpoint for 10% of the run; alternate increasing/decreasing ramps.
  ramp_start_fraction: 0.1
  ramp_end_fraction: 0.9
  initial_position: [0.05, 0.15]
  initial_velocity: [-0.05, 0.05]
  # Optional static-parameter intervals, sampled by seeded Latin hypercube.
  parameter_ranges: {}
labeling:
  threshold: 0.01
  transient_periods: 40
  evaluation_periods: 100
  min_evaluation_periods: 40
  samples_per_period: 32
  substeps: 5
  epsilon: 1.0e-8
  convergence_tolerance: 0.025
  threshold_margin: 0.005
  stride_periods: 1
  poincare_points: 64
  poincare_tolerance: 0.01
data_dir: data/duffing_v1
